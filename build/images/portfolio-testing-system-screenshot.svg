<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .bg { fill: url(#g1); opacity: 0.15; }
      .card { fill: #0f172a; stroke: rgba(255,255,255,0.06); stroke-width: 1; }
      .title { fill: #e6eef8; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; font-size: 28px; font-weight: 700; }
      .muted { fill: #9fb3c8; font-size: 16px; }
      .chip { fill: rgba(6,182,212,0.12); stroke: rgba(6,182,212,0.25); }
    </style>
  </defs>

  <rect width="1200" height="700" rx="16" ry="16" fill="#0b1220" />
  <rect x="40" y="40" width="1120" height="620" rx="12" ry="12" class="bg"/>

  <!-- Card -->
  <rect x="80" y="90" width="1040" height="520" rx="10" ry="10" class="card"/>

  <!-- Header -->
  <text x="120" y="150" class="title">Portfolio Testing System</text>
  <text x="120" y="185" class="muted">Automated test suite with Flask, Selenium, pytest and CSV bug tracking</text>

  <!-- Tags -->
  <g transform="translate(120,210)">
    <rect x="0" y="0" width="140" height="34" rx="8" class="chip"/>
    <text x="18" y="22" class="muted">Flask</text>

    <rect x="160" y="0" width="160" height="34" rx="8" class="chip"/>
    <text x="178" y="22" class="muted">Selenium</text>

    <rect x="340" y="0" width="120" height="34" rx="8" class="chip"/>
    <text x="352" y="22" class="muted">pytest</text>

    <rect x="480" y="0" width="160" height="34" rx="8" class="chip"/>
    <text x="498" y="22" class="muted">Bug Tracker</text>
  </g>

  <!-- Mock browser window -->
  <g transform="translate(120,270)">
    <rect x="0" y="0" width="960" height="320" rx="8" ry="8" fill="#071024" stroke="rgba(255,255,255,0.03)"/>
    <circle cx="28" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="56" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="84" cy="22" r="6" fill="#27c93f"/>

    <!-- Columns inside window -->
    <rect x="24" y="52" width="360" height="220" rx="6" fill="#071a2a"/>
    <rect x="404" y="52" width="520" height="220" rx="6" fill="#071a2a"/>

    <!-- Lines for text -->
    <g fill="#2e4a5b">
      <rect x="44" y="72" width="300" height="12" rx="6"/>
      <rect x="44" y="96" width="240" height="10" rx="5"/>
      <rect x="44" y="118" width="200" height="10" rx="5"/>

      <rect x="424" y="72" width="460" height="12" rx="6"/>
      <rect x="424" y="96" width="420" height="10" rx="5"/>
      <rect x="424" y="118" width="380" height="10" rx="5"/>
      <rect x="424" y="140" width="300" height="10" rx="5"/>
    </g>
  </g>

  <!-- footer label -->
  <text x="120" y="640" class="muted">View on GitHub: github.com/ad-ityaa/port-test</text>

</svg>